<style>
:root{--bg:#101820;--card:#1b2632;--acc:#4fc3f7;--ok:#7ce38b;--warn:#ffb74d;--ng:#ef5350;--tx:#e8eef4;--sub:#9fb2c1;--line:#2b3a49;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
header{padding:14px 14px 6px}
h1{font-size:18px;margin:0}
.sub{color:var(--sub);font-size:12px;margin:4px 0 0}
#io{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
.btn{background:var(--acc);color:#06222f;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:#2b3a49;color:var(--tx)}
.btn:disabled{opacity:.4}
#status{padding:8px 14px;color:var(--sub);font-size:12px;white-space:pre-wrap}
#cards{padding:10px;display:flex;flex-direction:column;gap:12px;max-width:680px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line)}
.chead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none}
.chead .nm{flex:1;min-width:0}
input{background:#0c141b;color:var(--tx);border:1px solid #34485c;border-radius:8px;padding:8px;font-size:16px;width:100%}
.ivrow{display:flex;gap:8px;align-items:center;margin:6px 0}
.ivbox{flex:1;text-align:center}
.ivbox label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.ivbox input{text-align:center;font-size:20px;font-weight:700;padding:7px 4px}
.numrow{display:flex;gap:8px;margin:6px 0}
.numbox{flex:1}
.numbox label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.numbox input{text-align:center}
.fam{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.frow{display:grid;grid-template-columns:5.5em 1fr 1fr 1fr;gap:4px;padding:5px 0;border-bottom:1px dashed #243241;font-size:12px;align-items:center}
.frow.fhead{color:var(--sub);font-size:11px;border-bottom:1px solid var(--line)}
.frow.me{background:#16324a33;border-radius:8px}
.fn{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{text-align:center}
.cell .rk{font-weight:800;color:var(--acc);font-size:14px}
.cell .pc{color:var(--sub);font-size:11px}
.cell .dt{color:var(--sub);font-size:10px;display:block}
.evo{margin-top:8px;font-size:12px;color:var(--tx);background:#0c141b;border-radius:10px;padding:8px;border:1px solid var(--line)}
.evo .over{color:var(--ng);font-weight:700}
.evo .safe{color:var(--ok)}
.msg{font-size:11px;color:var(--warn);margin-top:6px}
.lv{font-size:12px;color:var(--ok);margin-top:4px}
footer{padding:20px 14px;color:var(--sub);font-size:11px;max-width:680px;margin:0 auto}

const cpFloat=(A,D,S,c)=>A*Math.sqrt(D)*Math.sqrt(S)*c*c/10;
const cpOf=(A,D,S,c)=>Math.max(10,Math.floor(cpFloat(A,D,S,c)));
const hpOf=(S,c)=>Math.max(10,Math.floor(S*c));
// 最適レベル: 整数CPでcap以下になる最大レベル。評価値= A*D*floor(S*c)*c^2
function bestUnder(bA,bD,bS,a,d,h,cap){
  const A=bA+a,D=bD+d,S=bS+h;
  for(let li=MAX_LI;li>=0;li--){const c=CPM[li];
    if(cpOf(A,D,S,c)<=cap) return {li,p:A*D*Math.floor(S*c)*c*c};}
  return {li:-1,p:0};
}
function detail(bA,bD,bS,a,d,h,cap){
  const b=bestUnder(bA,bD,bS,a,d,h,cap);
  if(b.li<0) return null;
  const c=CPM[b.li];
  return {li:b.li,lv:1+b.li/2,cp:cpOf(bA+a,bD+d,bS+h,c),hp:hpOf(bS+h,c),p:b.p};
}
function pvRank(bA,bD,bS,a,d,h,cap){
  const mine=bestUnder(bA,bD,bS,a,d,h,cap).p;
  let better=0,best=0;
  for(let ia=0;ia<16;ia++)for(let id2=0;id2<16;id2++)for(let is=0;is<16;is++){
    const p=bestUnder(bA,bD,bS,ia,id2,is,cap).p;
    if(p>best)best=p; if(p>mine)better++;
  }
  return {rank:better+1,pct:best?Math.round(mine/best*1000)/10:0};
}

const toKata=s=>(s||"").replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const dp=new Array(n+1);for(let j=0;j<=n;j++)dp[j]=j;
  for(let i=1;i<=m;i++){let pr=dp[0];dp[0]=i;
    for(let j=1;j<=n;j++){const t=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,pr+(a[i-1]!==b[j-1]?1:0));pr=t;}}
  return dp[n];}
function bestName(text){
  let best=-1,bs=0;
  for(let i=0;i<POKE.length;i++){
    const n=NORM(POKE[i][1]);if(!n)continue;
    let sc=0;
    if(text===n)sc=1;
    else if(text.includes(n)||n.includes(text))sc=Math.min(n.length,text.length)/Math.max(n.length,text.length)*0.96;
    else sc=1-lev(text,n)/Math.max(n.length,text.length);
    if(sc>bs){bs=sc;best=i;}
  }
  return {i:best,score:bs};
}

function detectBars(cv){
  const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  const barLeft=Math.round(W*0.116);
  const barFull=Math.round(W*0.346);
  const segW=barFull/15;
  const barYs=[0.771,0.812,0.855];
  function segFilled(sx,sy){
    let col=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const x=Math.min(W-1,Math.max(0,Math.round(sx+dx)));
      const y=Math.min(H-1,Math.max(0,Math.round(sy+dy)));
      const d=ctx.getImageData(x,y,1,1).data;
      const r=d[0],g=d[1],b=d[2];
      const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
      if((mx-mn)>45&&mx>90)col++;
    }
    return col>=5;
  }
  const vals=[];
  for(const bf of barYs){
    let bestF=0;
    for(let dy=-0.006;dy<=0.006;dy+=0.002){
      const y=H*(bf+dy);
      let f=0;
      for(let s=0;s<15;s++){
        const x=barLeft+s*segW+segW/2;
        if(segFilled(x,y))f=s+1;
      }
      if(f>bestF)bestF=f;
    }
    vals.push(bestF);
  }
  return vals;
}

async function ocrRegion(cv,tFrac,bFrac){

}
function parseName(text){
  let b={i:-1,score:0};
  for(const line of text.split("\n")){
    const t=NORM(line);
    if(t.length<2||/^\d+$/.test(t))continue;
    const r=bestName(t);

  let m=text.match(/CP[^0-9]{0,5}(\d{2,5})/i);

  }
  return null;
}

  }catch(e){it.msg+="名前OCR失敗 ";}
  try{
    const topText=await ocrRegion(cv,0,0.50);
    const cp=parseCp(topText);
    if(cp)it.cp=cp;
    const hp=parseHp(topText);
    if(hp)it.hp=hp;
  }catch(e){it.msg+="CP/HP OCR失敗 ";}
  recalc(it);
  it.done=true;render();
}
function recalc(it){
  it.lvStr="";it.curLi=null;
  if(it.a!=null&&it.d!=null&&it.h!=null&&it.cp&&it.hp){
    const cand=speciesCandidates(it.a,it.d,it.h,it.cp,it.hp);
    if(cand.length){
      if(it.pi<0||!cand.some(c=>c.i===it.pi)){
        if(it.pi>=0)it.msg=(it.msg||"")+"数値優先 ";
        it.pi=cand[0].i;
      }
      const hit=cand.find(c=>c.i===it.pi);
      if(hit){it.lvStr=hit.lv.map(li=>"Lv"+(1+li/2)).join("/");it.curLi=hit.lv[0];}
    }
  }
}

// ---------- 表示 ----------
function cellHtml(r){
  if(!r)return '<div class="cell"><span class="rk" style="color:var(--sub)">-</span></div>';
  let dt="";
  if(r.det)dt='<span class="dt">CP'+r.det.cp+' Lv'+r.det.lv+' HP'+r.det.hp+'</span>';
  return '<div class="cell"><span class="rk">#'+r.rank+'</span> <span class="pc">'+r.pct+'%</span>'+dt+'</div>';
}
function familyHtml(it){
  if(it.pi<0||it.a==null||it.d==null||it.h==null)return "";
  const ci=CHAIN_OF[it.pi];
  const chain=(ci>=0?CHAINS[ci]:[it.pi]).filter((v,i,arr)=>arr.indexOf(v)===i);
  let html='<div class="fam"><div class="frow fhead"><span></span><span class="cell">SL(1500)</span><span class="cell">HL(2500)</span><span class="cell">ML</span></div>';
  chain.forEach(m=>{
    const r=calcAll(m,it.a,it.d,it.h);
    const me=(m===it.pi)?" me":"";
    html+='<div class="frow'+me+'"><span class="fn">'+POKE[m][1]+'</span>'+cellHtml(r.SL)+cellHtml(r.HL)+cellHtml(r.ML)+'</div>';
  });
  html+='</div>';
  // そのまま進化した際のCP
  if(it.curLi!=null){
    const pos=chain.indexOf(it.pi);
    const c=CPM[it.curLi];
    const lv=1+it.curLi/2;
    const nexts=chain.slice(pos+1);
    if(nexts.length){
      let ev='<div class="evo">このまま進化（Lv'+lv+'のまま）: ';
      nexts.forEach(m=>{
        const p=POKE[m];
        const cp=cpOf(p[2]+it.a,p[3]+it.d,p[4]+it.h,c);
        const sl=cp<=1500?'<span class="safe">SL◯</span>':'<span class="over">SL超過</span>';
        const hl=cp<=2500?'<span class="safe">HL◯</span>':'<span class="over">HL超過</span>';
        ev+='<div>'+p[1]+' → <b>CP'+cp+'</b>　'+sl+' '+hl+'</div>';
      });
      html+=ev+'</div>';
    }
  }
  return html;
}
function render(){
  const wrap=$("#cards");wrap.innerHTML="";
  let any=false;
  items.forEach((it,idx)=>{
    any=true;
    const card=document.createElement("div");card.className="card";
    card.innerHTML=
      '<div class="chead"><img class="thumb" src="'+it.url+'">'+
      '<div class="nm"><input list="namelist" data-i="'+idx+'" data-k="pi" value="'+(it.pi>=0?POKE[it.pi][1]:"")+'" placeholder="ポケモン名"></div></div>'+
      formChips(it,idx)+
      '<div class="ivrow">'+
      '<div class="ivbox"><label>攻撃</label><input data-i="'+idx+'" data-k="a" value="'+(it.a??"")+'"></div>'+
      '<div class="ivbox"><label>防御</label><input data-i="'+idx+'" data-k="d" value="'+(it.d??"")+'"></div>'+
      '<div class="ivbox"><label>HP</label><input data-i="'+idx+'" data-k="h" value="'+(it.h??"")+'"></div></div>'+
      '<div class="numrow">'+
      '<div class="numbox"><label>CP</label><input data-i="'+idx+'" data-k="cp" value="'+(it.cp??"")+'"></div>'+
      '<div class="numbox"><label>HP(実数値)</label><input data-i="'+idx+'" data-k="hp" value="'+(it.hp??"")+'"></div></div>'+
      (it.lvStr?'<div class="lv">一致レベル: '+it.lvStr+'</div>':"")+
      familyHtml(it)+
      (it.msg?'<div class="msg">'+it.msg+'</div>':"");
    wrap.appendChild(card);
  });
  wrap.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const it=items[+inp.dataset.i],k=inp.dataset.k;
      if(k==="pi"){
        const t=NORM(inp.value);const r=bestName(t);
        it.pi=(r.score>=0.60)?r.i:-1;
      }else{
        const v=parseInt(inp.value,10);
        it[k]=isNaN(v)?null:v;
      }
      recalc(it);render();
    });
  });
  wrap.querySelectorAll("button[data-f]").forEach(b=>b.addEventListener("click",()=>{
    const it=items[+b.dataset.f];it.pi=+b.dataset.p;recalc(it);render();
  }));
  $("#csvBtn").disabled=!any;
}

// ---------- CSV（最終進化形の順位も出力） ----------
$("#csvBtn").addEventListener("click",()=>{
  const head=["ポケモン","攻撃","防御","HP個体","CP","HP","一致レベル","SL順位","SL%","HL順位","HL%","ML順位","ML%","メモ"];
  const lines=[head.join(",")];
  items.forEach(it=>{
    let cells=["","","","","",""];
    if(it.pi>=0&&it.a!=null&&it.d!=null&&it.h!=null){
      const ci=CHAIN_OF[it.pi];
      const chain=(ci>=0?CHAINS[ci]:[it.pi]);
      const fin=chain[chain.length-1];
      const r=calcAll(fin,it.a,it.d,it.h);
      cells=[r.SL.rank,r.SL.pct,r.HL.rank,r.HL.pct,r.ML.rank,r.ML.pct];
    }
    lines.push([it.pi>=0?POKE[it.pi][1]:"",it.a??"",it.d??"",it.h??"",it.cp??"",it.hp??"",it.lvStr||"",
      ...cells,(it.msg||"").replace(/,/g," ")].join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="iv_results.csv";a.click();
});

// ---------- 入力 ----------
$("#file").addEventListener("change",async e=>{
  const files=[...e.target.files];
  if(!files.length)return;
  status(files.length+"枚を解析中…");
  for(const f of files){
    const it={file:f,url:URL.createObjectURL(f),pi:-1,a:null,d:null,h:null,cp:null,hp:null,msg:"",lvStr:"",curLi:null,done:false};
    items.push(it);render();
    try{await analyze(it);}catch(err){it.msg+="解析エラー ";it.done=true;render();}
    status("解析中… "+items.filter(x=>x.done).length+"/"+items.length);
  }
  status("完了："+items.length+"件。");
  e.target.value="";
});
$("#clearBtn").addEventListener("click",()=>{items.length=0;rankCache.clear();render();status("クリアしました。");});

(function(){
  const dl=document.createElement("datalist");dl.id="namelist";
  POKE.forEach(p=>{const o=document.createElement("option");o.value=p[1];dl.appendChild(o);});
  document.body.appendChild(dl);
})();
