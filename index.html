<style>
:root{--bg:#101820;--card:#1b2632;--acc:#4fc3f7;--ok:#7ce38b;--warn:#ffb74d;--ng:#ef5350;--tx:#e8eef4;--sub:#9fb2c1;--line:#2b3a49;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
header{padding:16px 14px 8px}
h1{font-size:19px;margin:0}
.sub{color:var(--sub);font-size:12px;margin:6px 0 0}
#io{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
.btn{background:var(--acc);color:#06222f;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:#2b3a49;color:var(--tx)}
.btn:disabled{opacity:.4}
#status{padding:8px 14px;color:var(--sub);font-size:12px;white-space:pre-wrap}
#cards{padding:10px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line)}
.chead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none}
.chead .nm{flex:1;min-width:0}
input,select{background:#0c141b;color:var(--tx);border:1px solid #34485c;border-radius:8px;padding:8px;font-size:16px;width:100%}
.ivrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.ivbox{flex:1;text-align:center}
.ivbox label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.ivbox input{text-align:center;font-size:20px;font-weight:700;padding:8px 4px}
.numrow{display:flex;gap:8px;margin:8px 0}
.numbox{flex:1}
.numbox label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.numbox input{text-align:center}
.ranks{display:flex;gap:8px;margin-top:8px}
.rankbox{flex:1;background:#0c141b;border-radius:10px;padding:8px;text-align:center;border:1px solid var(--line)}
.rankbox .lg{font-size:11px;color:var(--sub)}
.rankbox .rk{font-size:17px;font-weight:800;color:var(--acc)}
.rankbox .pc{font-size:11px;color:var(--sub)}
.msg{font-size:11px;color:var(--warn);margin-top:6px}
.lv{font-size:12px;color:var(--ok);margin-top:4px}
footer{padding:20px 14px;color:var(--sub);font-size:11px;max-width:640px;margin:0 auto}
</style>

const cpOf=(A,D,S,c)=>Math.max(10,Math.floor(A*Math.sqrt(D)*Math.sqrt(S)*c*c/10));
const hpOf=(S,c)=>Math.max(10,Math.floor(S*c));
function prodBest(bA,bD,bS,a,d,h,cap){
  const A=bA+a,D=bD+d,S=bS+h;
  for(let li=CPM.length-1;li>=0;li--){const c=CPM[li];
    if(cpOf(A,D,S,c)<=cap)return A*D*S*c*c*c;}
  return 0;
}
function pvRank(bA,bD,bS,a,d,h,cap){
  const my=prodBest(bA,bD,bS,a,d,h,cap);
  let better=0,best=0;
  for(let ia=0;ia<16;ia++)for(let id2=0;id2<16;id2++)for(let is=0;is<16;is++){
    const p=prodBest(bA,bD,bS,ia,id2,is,cap);
    if(p>best)best=p; if(p>my)better++;
  }
  return {rank:better+1,pct:best?Math.round(my/best*1000)/10:0};
}
function calcRanks(pi,a,d,h){
  const key=pi+"_"+a+"_"+d+"_"+h;
  if(rankCache.has(key))return rankCache.get(key);

function matchLevels(p,a,d,h,cp,hp){
  const out=[];

    if(cpOf(p[2]+a,p[3]+d,p[4]+h,c)===cp&&hpOf(p[4]+h,c)===hp)out.push(1+li/2);}
  return out;
}
function speciesCandidates(a,d,h,cp,hp){
  const r=[];
  for(let i=0;i<POKE.length;i++){const lv=matchLevels(POKE[i],a,d,h,cp,hp);if(lv.length)r.push({i,lv});}

}

const toKata=s=>(s||"").replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const NORM=s=>toKata(s).replace(/[^0-9A-Za-z\u30A1-\u30FC]/g,"");
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const dp=new Array(n+1);for(let j=0;j<=n;j++)dp[j]=j;
  for(let i=1;i<=m;i++){let pr=dp[0];dp[0]=i;
    for(let j=1;j<=n;j++){const t=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,pr+(a[i-1]!==b[j-1]?1:0));pr=t;}}
  return dp[n];}
function bestName(text){
  let best=-1,bs=0;
  for(let i=0;i<POKE.length;i++){
    const n=NORM(POKE[i][1]);if(!n)continue;
    let sc=0;
    if(text===n)sc=1;
    else if(text.includes(n)||n.includes(text))sc=Math.min(n.length,text.length)/Math.max(n.length,text.length)*0.96;
    else sc=1-lev(text,n)/Math.max(n.length,text.length);
    if(sc>bs){bs=sc;best=i;}
  }
  return {i:best,score:bs};
}

// ---------- バー検出（座標固定方式 v2） ----------
// 実測: バーは x≈11.6%W 開始、全長≈43%W。行は y≈79.4%H / 81.2%H / 85.5%H 付近。
// セグメントは15個、各色で検出し、グレー(未充填)との境界で充填数を数える。
function barValue(cv, yFrac){
  const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  const y=Math.round(H*yFrac);
  const x0=Math.round(W*0.116), x1=Math.round(W*0.116+W*0.43);
  const img=ctx.getImageData(x0,y-3,x1-x0,7).data;
  // 中央行を使う
  const row=3;
  const segW=(x1-x0)/15;
  let filled=0;
  for(let s=0;s<15;s++){
    // 各セグメントの中央をサンプル
    const sx=Math.round(s*segW+segW/2);
    const o=(row*(x1-x0)+sx)*4;
    const r=img[o],g=img[o+1],b=img[o+2];
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    const coloredPix=(mx-mn)>40&&mx>100;
    if(coloredPix)filled=s+1;
  }
  return filled;
}
function detectBarsFixed(cv){
  // バー行のy位置を微調整探索: 候補3行の周辺で最も着色が安定するyを探す
  const base=[0.794,0.812,0.855];
  const vals=[];
  for(const bf of base){
    let bestV=0,bestScore=-1;
    for(let dy=-0.008;dy<=0.008;dy+=0.002){
      const v=barValue(cv,bf+dy);
      // スコア: 値が0でないことを優遇
      const sc=(v>0?1:0)*100+v;
      if(sc>bestScore){bestScore=sc;bestV=v;}
    }
    vals.push(bestV);
  }
  return vals;
}

// ---------- OCR ----------
let worker=null;
async function getWorker(){
  if(!worker){status("OCRエンジン準備中（初回のみ数十秒）…");
    worker=await Tesseract.createWorker(["jpn","eng"]);}
  return worker;
}
async function ocrTop(cv){
  const w=await getWorker();
  const H=cv.height,W=cv.width;
  const c2=document.createElement("canvas");
  c2.width=W;c2.height=Math.floor(H*0.55);
  c2.getContext("2d").drawImage(cv,0,0,W,c2.height,0,0,W,c2.height);
  const r=await w.recognize(c2);
  return r.data.text;
}
function parseOcr(text){
  const res={name:-1,cp:null,hp:null,score:0};
  const mCp=text.match(/CP[^0-9]{0,5}(\d{2,5})/i);
  if(mCp)res.cp=+mCp[1];
  const mHp=text.match(/(\d{1,3})\s*[\//]\s*(\d{1,3})\s*HP/i);
  if(mHp)res.hp=+mHp[2];
  let b={i:-1,score:0};
  for(const line of text.split("\n")){
    const t=NORM(line);
    if(t.length<2||/^\d+$/.test(t))continue;
    const r=bestName(t);
    if(r.score>b.score)b=r;
  }
  if(b.score>=0.62){res.name=b.i;res.score=b.score;}
  return res;
}

// ---------- メイン処理 ----------
async function analyze(it){
  it.msg="";
  const img=await createImageBitmap(it.file);
  const scale=Math.min(1,750/img.width);
  const cv=document.createElement("canvas");
  cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  // 1) バー（座標固定）
  const[a,d,h]=detectBarsFixed(cv);
  if(a>0)it.a=a; if(d>0)it.d=d; if(h>0)it.h=h;
  if([a,d,h].some(v=>v===0))it.msg+="バー一部読取不可(手動で修正可) ";
  // 2) OCR
  try{
    const text=await ocrTop(cv);
    const o=parseOcr(text);
    if(o.cp)it.cp=o.cp;
    if(o.hp)it.hp=o.hp;
    if(o.name>=0)it.pi=o.name;
  }catch(e){it.msg+="OCR失敗 ";}
  // 3) 整合チェック
  recalc(it);
  it.done=true;render();
}
function recalc(it){
  it.lvStr="";
  if(it.a!=null&&it.d!=null&&it.h!=null&&it.cp&&it.hp){
    const cand=speciesCandidates(it.a,it.d,it.h,it.cp,it.hp);
    if(cand.length){
      if(it.pi<0||!cand.some(c=>c.i===it.pi)){
        if(it.pi>=0)it.msg=(it.msg||"")+"OCR名と数値不一致→数値優先 ";
        it.pi=cand[0].i;
      }
      const hit=cand.find(c=>c.i===it.pi);
      it.lvStr=hit?("Lv"+hit.lv.join("/")):"";
    }
  }
}

// ---------- 表示 ----------
function rankHtml(r){return r?('<div class="rk">#'+r.rank+'</div><div class="pc">'+r.pct+'%</div>'):'<div class="rk" style="color:var(--sub)">-</div>';}
function render(){
  const wrap=$("#cards");wrap.innerHTML="";
  let any=false;
  items.forEach((it,idx)=>{
    any=true;
    let r={SL:null,HL:null,ML:null};
    if(it.pi>=0&&it.a!=null&&it.d!=null&&it.h!=null){r=calcRanks(it.pi,it.a,it.d,it.h);}
    const card=document.createElement("div");card.className="card";
    card.innerHTML=
      '<div class="chead"><img class="thumb" src="'+it.url+'">'+
      '<div class="nm"><input list="namelist" data-i="'+idx+'" data-k="pi" value="'+(it.pi>=0?POKE[it.pi][1]:"")+'" placeholder="ポケモン名"></div></div>'+
      '<div class="ivrow">'+
      '<div class="ivbox"><label>攻撃</label><input data-i="'+idx+'" data-k="a" value="'+(it.a??"")+'"></div>'+
      '<div class="ivbox"><label>防御</label><input data-i="'+idx+'" data-k="d" value="'+(it.d??"")+'"></div>'+
      '<div class="ivbox"><label>HP</label><input data-i="'+idx+'" data-k="h" value="'+(it.h??"")+'"></div></div>'+
      '<div class="numrow">'+
      '<div class="numbox"><label>CP</label><input data-i="'+idx+'" data-k="cp" value="'+(it.cp??"")+'"></div>'+
      '<div class="numbox"><label>HP(実数値)</label><input data-i="'+idx+'" data-k="hp" value="'+(it.hp??"")+'"></div></div>'+
      '<div class="ranks">'+
      '<div class="rankbox"><div class="lg">SL 1500</div>'+rankHtml(r.SL)+'</div>'+
      '<div class="rankbox"><div class="lg">HL 2500</div>'+rankHtml(r.HL)+'</div>'+
      '<div class="rankbox"><div class="lg">ML 無制限</div>'+rankHtml(r.ML)+'</div></div>'+
      (it.lvStr?'<div class="lv">一致レベル: '+it.lvStr+'</div>':"")+
      (it.msg?'<div class="msg">'+it.msg+'</div>':"");
    wrap.appendChild(card);
  });
  wrap.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const it=items[+inp.dataset.i],k=inp.dataset.k;
      if(k==="pi"){
        const t=NORM(inp.value);const r=bestName(t);
        it.pi=(r.score>=0.62)?r.i:-1;
      }else{
        const v=parseInt(inp.value,10);
        it[k]=isNaN(v)?null:v;
      }
      recalc(it);render();
    });
  });
  $("#csvBtn").disabled=!any;
}

// ---------- CSV ----------
$("#csvBtn").addEventListener("click",()=>{
  const head=["ポケモン","攻撃","防御","HP個体","CP","HP","一致レベル","SL順位","SL%","HL順位","HL%","ML順位","ML%","メモ"];
  const lines=[head.join(",")];
  items.forEach(it=>{
    let r={SL:{rank:"",pct:""},HL:{rank:"",pct:""},ML:{rank:"",pct:""}};
    if(it.pi>=0&&it.a!=null&&it.d!=null&&it.h!=null)r=calcRanks(it.pi,it.a,it.d,it.h);
    lines.push([it.pi>=0?POKE[it.pi][1]:"",it.a??"",it.d??"",it.h??"",it.cp??"",it.hp??"",it.lvStr||"",
      r.SL.rank,r.SL.pct,r.HL.rank,r.HL.pct,r.ML.rank,r.ML.pct,(it.msg||"").replace(/,/g," ")].join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="iv_results.csv";a.click();
});

// ---------- 入力 ----------
$("#file").addEventListener("change",async e=>{
  const files=[...e.target.files];
  if(!files.length)return;
  status(files.length+"枚を解析中…（初回はOCRデータ取得で数十秒）");
  for(const f of files){
    const it={file:f,url:URL.createObjectURL(f),pi:-1,a:null,d:null,h:null,cp:null,hp:null,msg:"",lvStr:"",done:false};
    items.push(it);render();
    try{await analyze(it);}catch(err){it.msg+="解析エラー ";it.done=true;render();}
    status("解析中… "+items.filter(x=>x.done).length+"/"+items.length);
  }
  status("完了："+items.length+"件。誤認識は各欄を直接修正すると再計算されます。");
  e.target.value="";
});
$("#clearBtn").addEventListener("click",()=>{items.length=0;rankCache.clear();render();status("クリアしました。");});
